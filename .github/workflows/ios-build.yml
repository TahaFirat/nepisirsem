name: iOS Build & TestFlight Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS with Xcode on Cloud Mac
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'N7XD86ZSMH' }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD || 'LockIn2026!' }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Build Web Application
        run: npm run build

      - name: 5. Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: 6. Install Apple Distribution Certificate & Auto-Provision Profile
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          elif [ -f "apple_certs/certificate.p12" ]; then
            cp apple_certs/certificate.p12 $RUNNER_TEMP/certificate.p12
          fi

          if [ -f "$RUNNER_TEMP/certificate.p12" ]; then
            security import $RUNNER_TEMP/certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')
            echo "HAS_CERT=true" >> $GITHUB_ENV
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Resolve API key from secret or apple_certs/AuthKey_N7XD86ZSMH.p8
          if [ -z "$APP_STORE_CONNECT_API_KEY" ] && [ -f "apple_certs/AuthKey_N7XD86ZSMH.p8" ]; then
            export APP_STORE_CONNECT_API_KEY="$(cat apple_certs/AuthKey_N7XD86ZSMH.p8)"
          fi

          # If no .mobileprovision is in repo, auto-fetch or auto-create via App Store Connect API
          PROFILE_FILE=$(ls ios/App/*.mobileprovision apple_certs/*.mobileprovision 2>/dev/null | head -n 1 || true)
          if [ -z "$PROFILE_FILE" ] && [ -n "$APP_STORE_CONNECT_API_KEY" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "Auto-provisioning Bundle ID & App Store Profile via App Store Connect API..."
            pip3 install --quiet pyjwt cryptography requests
            python3 - << 'PYEOF'
          import os, re, time, base64, jwt, requests

          key_id = os.environ.get('APP_STORE_CONNECT_KEY_ID', 'N7XD86ZSMH').strip()
          issuer_id = os.environ.get('APP_STORE_CONNECT_ISSUER_ID', '').strip()
          raw_key = os.environ.get('APP_STORE_CONNECT_API_KEY', '').strip()
          b64 = re.sub(r'-----BEGIN [^-]+-----|-----END [^-]+-----|\s+', '', raw_key)
          lines = [b64[i:i+64] for i in range(0, len(b64), 64)]
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(lines) + '\n-----END PRIVATE KEY-----\n'

          token = jwt.encode(
              {'iss': issuer_id, 'iat': int(time.time()), 'exp': int(time.time()) + 1100, 'aud': 'appstoreconnect-v1'},
              pem, algorithm='ES256', headers={'kid': key_id, 'typ': 'JWT'}
          )
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          target_bundle = 'com.nepisirsem.hanimeli'

          # 1. Find or register Bundle ID
          r = requests.get('https://api.appstoreconnect.apple.com/v1/bundleIds', headers=headers, params={'filter[identifier]': target_bundle})
          data = r.json().get('data', [])
          bundle_id_res = None
          for b in data:
              if b['attributes']['identifier'] == target_bundle:
                  bundle_id_res = b['id']
                  break
          if not bundle_id_res:
              print(f"Registering Bundle ID {target_bundle}...")
              cr = requests.post('https://api.appstoreconnect.apple.com/v1/bundleIds', headers=headers, json={
                  'data': {
                      'type': 'bundleIds',
                      'attributes': {'identifier': target_bundle, 'name': 'Ne Pisirsem Hanimeli', 'platform': 'IOS'}
                  }
              })
              if cr.status_code in (200, 201):
                  bundle_id_res = cr.json()['data']['id']
                  print("Bundle ID registered:", bundle_id_res)

          # 2. Find Distribution Certificate
          cr = requests.get('https://api.appstoreconnect.apple.com/v1/certificates', headers=headers)
          certs = cr.json().get('data', [])
          dist_certs = [c['id'] for c in certs if 'DISTRIBUTION' in c['attributes'].get('certificateType', '')]

          # 3. Find or create IOS_APP_STORE Profile
          if bundle_id_res and dist_certs:
              pr = requests.get('https://api.appstoreconnect.apple.com/v1/profiles', headers=headers, params={'filter[name]': 'NePisirsem AppStore Profile'})
              prof_content = None
              for p in pr.json().get('data', []):
                  if p['attributes'].get('profileState') == 'ACTIVE':
                      prof_content = p['attributes']['profileContent']
                      break
              if not prof_content:
                  cpr = requests.post('https://api.appstoreconnect.apple.com/v1/profiles', headers=headers, json={
                      'data': {
                          'type': 'profiles',
                          'attributes': {'name': 'NePisirsem AppStore Profile', 'profileType': 'IOS_APP_STORE'},
                          'relationships': {
                              'bundleId': {'data': {'type': 'bundleIds', 'id': bundle_id_res}},
                              'certificates': {'data': [{'type': 'certificates', 'id': dist_certs[0]}]}
                          }
                      }
                  })
                  if cpr.status_code in (200, 201):
                      prof_content = cpr.json()['data']['attributes']['profileContent']
              if prof_content:
                  os.makedirs('ios/App', exist_ok=True)
                  with open('ios/App/NePisirsem.mobileprovision', 'wb') as f:
                      f.write(base64.b64decode(prof_content))
                  print("Saved ios/App/NePisirsem.mobileprovision via API!")
          PYEOF
            PROFILE_FILE=$(ls ios/App/*.mobileprovision apple_certs/*.mobileprovision 2>/dev/null | head -n 1 || true)
          fi

          if [ -n "$PROFILE_FILE" ] && [ -f "$PROFILE_FILE" ]; then
            echo "Installing Provisioning Profile: $PROFILE_FILE"
            security cms -D -i "$PROFILE_FILE" > $RUNNER_TEMP/profile.plist
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" $RUNNER_TEMP/profile.plist)
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" $RUNNER_TEMP/profile.plist)
            TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" $RUNNER_TEMP/profile.plist)
            APP_ID_FULL=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" $RUNNER_TEMP/profile.plist)
            BUNDLE_ID="${APP_ID_FULL#${TEAM_ID}.}"

            cp "$PROFILE_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision

            echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
            echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
            echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV

            cat > ios/App/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF
          fi

      - name: 7. Build Xcode Project Archive
        run: |
          cd ios/App
          if [ "$HAS_CERT" = "true" ] && [ -n "$PROFILE_NAME" ]; then
            echo "Building with official Apple Code Signing (Build #${{ github.run_number }})..."
            xcodebuild -project App.xcodeproj \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
                       PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID:-com.nepisirsem.hanimeli}" \
                       DEVELOPMENT_TEAM="${TEAM_ID:-U3YT2CXH58}" \
                       CODE_SIGN_STYLE="Manual" \
                       PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
                       CODE_SIGN_IDENTITY="Apple Distribution" \
                       clean archive \
                       -archivePath ./build/App.xcarchive
          else
            echo "Building archive (unsigned fallback until .mobileprovision or APP_STORE_CONNECT_ISSUER_ID is provided)..."
            xcodebuild -project App.xcodeproj \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
                       DEVELOPMENT_TEAM="U3YT2CXH58" \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       clean archive \
                       -archivePath ./build/App.xcarchive
          fi

      - name: 8. Export Official Signed App IPA
        run: |
          cd ios/App
          if [ -f "exportOptions.plist" ] && [ "$HAS_CERT" = "true" ] && [ -n "$PROFILE_NAME" ]; then
            echo "Exporting signed App.ipa using exportOptions.plist..."
            xcodebuild -exportArchive \
                       -archivePath ./build/App.xcarchive \
                       -exportPath ./build/export \
                       -exportOptionsPlist exportOptions.plist
            cp ./build/export/*.ipa ./build/App.ipa || true
          fi

          if [ ! -f "./build/App.ipa" ]; then
            echo "Packaging archive App.ipa..."
            cd build
            mkdir -p Payload
            cp -R App.xcarchive/Products/Applications/App.app Payload/
            zip -r App.ipa Payload
            cd ..
          fi
          cd ../..

      - name: 9. Upload Release Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NePisirsem-Signed-iOS-App
          path: |
            ios/App/build/App.ipa
            ios/App/build/App.xcarchive
          retention-days: 14

      - name: 10. Upload to Apple TestFlight / App Store Connect
        if: env.APP_STORE_CONNECT_ISSUER_ID != ''
        run: |
          set -o pipefail

          if [ -z "$APP_STORE_CONNECT_API_KEY" ] && [ -f "apple_certs/AuthKey_N7XD86ZSMH.p8" ]; then
            export APP_STORE_CONNECT_API_KEY="$(cat apple_certs/AuthKey_N7XD86ZSMH.p8)"
          fi

          KEY_ID=$(echo "$APP_STORE_CONNECT_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(echo "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '[:space:]')

          python3 -c "
          import os, re
          raw = os.environ.get('APP_STORE_CONNECT_API_KEY', '').strip()
          b64 = re.sub(r'-----BEGIN [^-]+-----|-----END [^-]+-----|\s+', '', raw)
          lines = [b64[i:i+64] for i in range(0, len(b64), 64)]
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(lines) + '\n-----END PRIVATE KEY-----\n'
          for d in [os.path.expanduser('~/.appstoreconnect/private_keys'), os.path.expanduser('~/.private_keys'), './private_keys']:
              os.makedirs(d, exist_ok=True)
              p = os.path.join(d, 'AuthKey_' + '${KEY_ID}' + '.p8')
              with open(p, 'w') as f:
                  f.write(pem)
              os.chmod(p, 0o600)
          "

          UPLOAD_SUCCESS=false

          echo "=== Attempting Upload via xcrun altool ==="
          if xcrun altool --upload-app --type ios --file ./ios/App/build/App.ipa --apiKey "${KEY_ID}" --apiIssuer "${ISSUER_ID}" --verbose 2>&1 | tee altool.log; then
            UPLOAD_SUCCESS=true
          else
            cat altool.log >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$UPLOAD_SUCCESS" = false ]; then
            TRANSPORTER=$(find /Applications/Xcode* -name iTMSTransporter 2>/dev/null | head -n 1)
            if [ -n "$TRANSPORTER" ] && [ -x "$TRANSPORTER" ]; then
              if "$TRANSPORTER" -m upload -assetFile ./ios/App/build/App.ipa -apiKey "${KEY_ID}" -apiIssuer "${ISSUER_ID}" 2>&1 | tee itms.log; then
                UPLOAD_SUCCESS=true
              else
                cat itms.log >> $GITHUB_STEP_SUMMARY
              fi
            fi
          fi

          if [ "$UPLOAD_SUCCESS" = false ]; then
            python3 -c "
            import json, os
            data = {
              'key_id': '${KEY_ID}',
              'issuer_id': '${ISSUER_ID}',
              'key_filepath': os.path.expanduser('~/.appstoreconnect/private_keys/AuthKey_' + '${KEY_ID}' + '.p8'),
              'duration': 1200,
              'in_house': False
            }
            with open('api_key.json', 'w') as f:
                json.dump(data, f)
            "
            if fastlane pilot upload --ipa ./ios/App/build/App.ipa --api_key_path api_key.json --skip_waiting_for_build_processing true 2>&1 | tee fastlane.log; then
              UPLOAD_SUCCESS=true
            else
              cat fastlane.log >> $GITHUB_STEP_SUMMARY
            fi
          fi

          if [ "$UPLOAD_SUCCESS" = false ]; then
            exit 1
          fi
